<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d9b61;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Building/Kantor icon -->
  <g fill="#ffffff">
    <!-- Base building -->
    <rect x="25" y="35" width="50" height="45" rx="2"/>
    
    <!-- Roof -->
    <path d="M 20 35 L 50 20 L 80 35 Z"/>
    
    <!-- Door -->
    <rect x="42" y="60" width="16" height="20" fill="#c8973a"/>
    
    <!-- Windows -->
    <rect x="30" y="42" width="8" height="8" fill="#e8f5ee"/>
    <rect x="46" y="42" width="8" height="8" fill="#e8f5ee"/>
    <rect x="62" y="42" width="8" height="8" fill="#e8f5ee"/>
    
    <!-- Letter/Document symbol on roof -->
    <g transform="translate(50, 28)">
      <rect x="-6" y="-4" width="12" height="8" rx="1" fill="#fef9ee"/>
      <path d="M -6 -4 L 0 0 L 6 -4" stroke="#c8973a" stroke-width="1" fill="none"/>
    </g>
  </g>
</svg>
